version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:18.17

    steps:
      - checkout

      - setup_remote_docker

      - run:
          name: Install dependencies
          command: cd Appcode && npm install

      - run:
          name: Run tests (optional)
          command: echo "No tests configured"

      - run:
          name: Build Docker Image
          command: |
            docker build -t $DOCKERHUB_USERNAME/todo-app:$CIRCLE_BUILD_NUM Appcode

      - run:
          name: Login to Docker Hub
          command: echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - run:
          name: Push Docker Image
          command: |
            docker push $DOCKERHUB_USERNAME/todo-app:$CIRCLE_BUILD_NUM

workflows:
  version: 2
  build-and-push:
    jobs:
      - build